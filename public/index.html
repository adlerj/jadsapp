        <h1>Jeff Adler — Director of Engineering at Dropbox</h1>
        <p>Engineering leader building AI products from zero to one using LLMs, Claude (Anthropic), and agentic orchestration. Specializes in agentic engineering, AI agents, ML integration, and scaling teams. Currently directing engineering organizations at Dropbox, leading Dash — the AI-powered universal search product. Based in Denver, CO.</p>

        <h2>Career</h2>
        <ul>
          <li><strong>Director of Engineering, Dropbox</strong> (2025–Present) — Leads the AI Experiences and Sync engineering orgs building Dash, Dropbox's AI-powered universal search. Drives agentic development practices with 80%+ AI-generated code using Claude and LLMs, and ML-powered workflows.</li>
          <li><strong>Senior Engineering Manager, Dropbox</strong> (2023–2025) — Built and scaled the Dash engineering team from zero to one, growing Dropbox's AI universal search to $1M ARR across 300K+ enterprise accounts.</li>
          <li><strong>Staff Software Engineer, Reddit</strong> (2021–2023) — iOS platform tech lead for 100+ engineer organization. Built SliceKit presentation framework and media infrastructure.</li>
          <li><strong>Staff Software Engineer, Dropbox</strong> (2019–2021) — Led HelloSign Mobile, Dropbox Scan, File Transfers, and Family Plan. Built mobile architectures at scale.</li>
          <li><strong>Senior Software Engineer, Google</strong> (2016–2019) — Technical lead for Google Drive iOS. Led Material Design 2 redesign and on-device ML integration for Google Search iOS.</li>
          <li><strong>Software Engineer, TrackVia & Maptext</strong> (2014–2016) — Built iOS apps including mPilot IFR navigation used by 70+ major airlines.</li>
        </ul>

        <h2>Education</h2>
        <p>Rutgers University, B.S. Computer & Electrical Engineering, Minor in CS</p>

        <h2>Expertise</h2>
        <p>AI product development, LLMs, Claude (Anthropic), agentic engineering, agentic orchestration, AI agents, machine learning, iOS software engineering, mobile architecture, engineering leadership, team scaling, and technical strategy.</p>

        <h2>Off the Clock</h2>
